<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi entrenamiento</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C60B1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6DC;--card:#fff;--ink:#2B1518;--mut:#7A6468;--line:#EBDDB8;--acc:#C60B1E;--accInk:#fff;--ok:#12A150;--okBg:#DDF5E7;--today:#FFC400;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A0F14;--card:#3A181E;--ink:#FFF3D6;--mut:#CDAFA0;--line:#5A2A31;--acc:#FFC400;--accInk:#2A0F14;--ok:#3DD483;--okBg:#1D4A34;--today:#8A6A00}}
:root[data-theme="dark"]{--bg:#2A0F14;--card:#3A181E;--ink:#FFF3D6;--mut:#CDAFA0;--line:#5A2A31;--acc:#FFC400;--accInk:#2A0F14;--ok:#3DD483;--okBg:#1D4A34;--today:#8A6A00}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.01em}
main{max-width:640px;margin:0 auto;padding:16px 14px 80px}
.flag{height:96px;border-radius:14px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#C60B1E 0 25%,#FFC400 25% 75%,#C60B1E 75% 100%)}
h1{font-size:2.1rem;line-height:1;color:#2B1518;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{font-size:1.5rem;text-transform:capitalize}
.nav{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.8rem;color:var(--mut);padding:4px 0}
.day{aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:none;position:relative;font-weight:500}
.day:hover{background:var(--bg)}
.day.today{background:var(--today)}
.day.sel{border-color:var(--acc);background:var(--acc);color:var(--accInk)}
.day .dot{position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--acc)}
.day.sel .dot{background:var(--accInk)}
.day .dot.full{background:var(--ok);width:8px;height:8px;margin-left:-4px}
.day-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.day-title h2{font-size:1.6rem;text-transform:capitalize}
.prog{color:var(--mut);font-size:.9rem}
.ex{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.ex-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex-head h3{margin:0;font-size:1.05rem}
.ex-head small{color:var(--mut)}
.ghost{background:none;border:none;color:var(--mut);padding:6px 8px;border-radius:8px}
.ghost.arm{color:#fff;background:#D64545;font-weight:600}
.ghost:hover{color:var(--ink);background:var(--bg)}
.set{display:grid;grid-template-columns:1.6rem 1fr 1fr 2.8rem 1.8rem;gap:6px;align-items:center;margin-top:6px}
.set .n{color:var(--mut);font-weight:600;text-align:center}
.field{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:var(--bg)}
.field input{width:100%;min-width:0;border:none;background:none;color:inherit;font:inherit;font-size:1.05rem;font-weight:600;padding:9px 0;text-align:right}
.field input:focus{outline:none}
.field:focus-within{border-color:var(--acc)}
.field span{color:var(--mut);font-size:.85rem}
.chk{height:40px;border-radius:10px;border:2px solid var(--line);background:none;font-size:1.2rem;font-weight:700;color:transparent}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done .field{background:var(--okBg)}
.addset{margin-top:8px;background:none;border:1px dashed var(--line);border-radius:10px;padding:8px;width:100%;color:var(--mut)}
.primary{background:var(--acc);color:var(--accInk);border:none;border-radius:12px;padding:13px 16px;font-weight:600;width:100%}
.empty{color:var(--mut);text-align:center;padding:14px 8px}
.sheet{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:640px;max-height:88%;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.panel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.panel h2{font-size:1.5rem}
.search{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;font:inherit;padding:10px 12px;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;background:none;padding:5px 12px;font-size:.9rem}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.list{overflow-y:auto;flex:1}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:12px 4px}
.item small{color:var(--mut)}
.item.added{color:var(--ok);font-weight:600}
.finish{margin-top:10px;width:100%;border:2px solid var(--ok);background:none;color:var(--ok);border-radius:12px;padding:12px 16px;font-weight:600}
.finish.on{background:var(--ok);color:#fff}
.finish:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;background:var(--ok);color:#fff;border-radius:999px;padding:1px 10px;font-size:.85rem;font-weight:600}
.day .fin{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:.65rem;line-height:16px;font-weight:700}
.hist h2{font-size:1.5rem;margin-bottom:8px}
.hist details{border-bottom:1px solid var(--line);padding:8px 0}
.hist summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;text-transform:capitalize}
.hist summary span{font-weight:400;color:var(--mut);font-size:.9rem;text-transform:none}
.hx{margin:8px 0 0}
.hx b{display:block;font-size:.95rem}
.hx div{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.hx i{font-style:normal;font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--mut)}
.hx i.d{background:var(--okBg);border-color:var(--ok);color:var(--ink)}
.open-day{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.9rem;margin-top:2px}
#bk h2{font-size:1.5rem;margin-bottom:6px}
#bk p{margin:0;color:var(--mut);font-size:.9rem}
.bkbtns{display:flex;gap:8px;margin:10px 0}
.bkbtns .primary{width:auto;flex:1}
.primary.alt{background:none;color:var(--ink);border:2px solid var(--acc)}
#bk textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;font:.8rem monospace;padding:8px}
#bkmsg{min-height:1.3em;margin-top:6px!important}
.cm{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;font:inherit;font-size:.95rem;padding:9px 10px}
.hn{margin:-4px 0 8px;color:var(--mut);font-size:.9rem}
.who{display:flex;justify-content:space-between;align-items:center;margin:-4px 2px 10px}
.who b{font-size:1.05rem}
#usr .item{cursor:default}
.ub{flex:1;text-align:left;background:none;border:none;font:inherit;color:inherit;padding:8px 0;font-weight:600}
#usrP{margin:0 0 8px;color:var(--mut);font-size:.9rem}
.note{color:var(--mut);font-size:.8rem;text-align:center;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.set.done .chk{transition:background .15s}}
</style>
</head>
<body>
<main>
  <header class="flag"><h1>Mi entrenamiento</h1></header>
  <div class="who"><span>👤 <b id="whoName"></b></span><button class="ghost" id="chg">Cambiar usuario</button></div>
  <section class="card" aria-label="Calendario">
    <div class="cal-head">
      <button class="nav" id="prev" aria-label="Mes anterior">‹</button>
      <h2 id="month"></h2>
      <button class="nav" id="next" aria-label="Mes siguiente">›</button>
    </div>
    <div class="grid" id="cal"></div>
  </section>
  <section class="card" id="day" aria-live="polite"></section>
  <section class="card hist" id="hist"></section>
  <section class="card" id="bk"><h2>Copia de seguridad</h2>
    <p>Exporta tus datos para guardarlos o pasarlos a otro móvil. Para recuperarlos, pega el texto aquí y pulsa Importar.</p>
    <div class="bkbtns"><button class="primary" id="exp">Exportar datos</button><button class="primary alt" id="imp">Importar datos</button></div>
    <textarea id="bkt" rows="4" aria-label="Datos de la copia de seguridad" placeholder="Aquí aparecerán tus datos al exportar."></textarea>
    <p id="bkmsg" role="status"></p></section>
  <p class="note" id="saveNote"></p>
</main>

<div class="sheet" id="usr" role="dialog" aria-modal="true" aria-label="Usuarios"><div class="panel">
  <div class="panel-top"><h2 id="usrT">Usuarios</h2><button class="ghost" id="usrX">Cerrar</button></div>
  <p id="usrP"></p>
  <div class="list" id="usrL"></div>
  <input class="search" id="usrN" placeholder="Nombre del nuevo usuario" maxlength="30" autocomplete="off" style="margin-top:8px">
  <button class="primary" id="usrC">Crear usuario</button>
</div></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Añadir ejercicio">
  <div class="panel">
    <div class="panel-top"><h2>Añadir ejercicios</h2><button class="ghost" id="close">Listo</button></div>
    <input class="search" id="q" type="search" placeholder="Buscar o crear un ejercicio" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const LIB={"PECHO": ["PRESS BANCA DECLINADO", "PRESS BANCA INCLINADO", "PRESS BANCA", "MAQUINA PECHO INCLINADO", "MAQUINA PECHO DECLINADO", "MAQUINA PECHO", "HAMMER PECHO", "PECHO EN POLEA ALTA", "PECHO EN POLEA MEDIO", "PECHO EN POLEA BAJA"], "ESPALDA": ["JALON A PECHO ABIERTO", "JALON A PECHO CERRADO", "ESPALDA REMO", "ESPALDA MAQUINA JALON ALTO", "ESPALDA MAQUINA REMO", "ESPALDA EN T"], "TRICEPS": ["TRICEPS POLEA ALTO SIN AGARRE", "TRICEPS POLEA BAJA SIN AGARRE", "TRICEPS POLEA ALTA CON AGARRE ABIERTO", "TRICEPS POLEA ALTA AGARRE ABIERTO DETRÁS CABEZA"], "HOMBRO": ["POLEA ALTA CUERDA", "POLEA MEDIA ESTIRAMIENTO HOMBRO", "MANCUERNA AL FRENTE", "MANCUERNA ABIERTA"], "BICEPS": ["BICEPS CURL POLEA MEDIA", "BICEPS CURL PESA V", "BICEPS CURL MARTILLO MANCUERNA"], "ANTEBRAZO": ["ANTEBRAZO POLEA ABAJO", "ANTEBRAZO CURL PESA V"], "ABDOMINALES": ["ABDOMINAL NORMAL", "ABDOMINAL LATERAL", "ABDOMINAL INFERIOR", "ABDOMINAL PIERNA ARRIBA"], "CARDIO": ["CARDIO 15 INCLINACION 4 VELOCIDAD", "CARDIO 15 INCLINACION 4,5 VELOCIDAD", "CARDIO 15 INCLINACION 5 VELOCIDAD", "CARDIO 15 INCLINACION 5,5 VELOCIDAD"]};
const UK="gym-users-v1",OLD="gym-tracker-v1";
let USR={users:[],cur:null};
try{const u=JSON.parse(localStorage.getItem(UK));if(u&&Array.isArray(u.users))USR=u}catch(e){}
let S={days:{},finished:{},custom:[]};
const dk=id=>"gym-data-"+id;
function saveU(){try{localStorage.setItem(UK,JSON.stringify(USR))}catch(e){}}
function loadS(){S={days:{},finished:{},custom:[]};try{const r=localStorage.getItem(dk(USR.cur));if(r)S=JSON.parse(r)}catch(e){}S.days=S.days||{};S.finished=S.finished||{};S.custom=S.custom||[]}
let saveOk=true;
function save(){if(!USR.cur)return;try{localStorage.setItem(dk(USR.cur),JSON.stringify(S))}catch(e){saveOk=false;$("#saveNote").textContent="No se pudo guardar en este navegador: los datos se perderán al cerrar."}}
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isCardio=n=>(LIB.CARDIO||[]).includes(n);
const U=n=>isCardio(n)?["min","km"]:["kg","rep"];
const todayKey=key(new Date());
let sel=todayKey, vy=new Date().getFullYear(), vm=new Date().getMonth(), filter="Todos", q="";

function renderCal(){
  $("#month").textContent=new Date(vy,vm,1).toLocaleDateString("es-ES",{month:"long",year:"numeric"});
  let h=["L","M","X","J","V","S","D"].map(d=>`<div class="dow">${d}</div>`).join("");
  const off=(new Date(vy,vm,1).getDay()+6)%7, n=new Date(vy,vm+1,0).getDate();
  h+="<div></div>".repeat(off);
  for(let d=1;d<=n;d++){
    const k=vy+"-"+pad(vm+1)+"-"+pad(d), ex=S.days[k]||[];
    const sets=ex.flatMap(e=>e.sets), full=sets.length&&sets.every(s=>s.done);
    h+=`<button class="day${k===todayKey?" today":""}${k===sel?" sel":""}" data-k="${k}" aria-label="${d}${S.finished[k]?", entrenamiento completado":ex.length?", con ejercicios":""}">${d}${S.finished[k]?`<i class="fin">✓</i>`:""}${ex.length?`<i class="dot${full?" full":""}"></i>`:""}</button>`;
  }
  $("#cal").innerHTML=h;
}
function renderDay(){
  const ex=S.days[sel]||[], all=ex.flatMap(e=>e.sets), done=all.filter(s=>s.done).length;
  const [y,m,d]=sel.split("-").map(Number);
  const title=new Date(y,m-1,d).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
  let h=`<div class="day-title"><h2>${title}</h2>${S.finished[sel]?`<span class="badge">✓ Completado</span>`:""}<span class="prog">${all.length?`${done} de ${all.length} series hechas`:""}</span></div>`;
  if(!ex.length)h+=`<p class="empty">No hay ejercicios este día. Añade el primero.</p>`;
  ex.forEach((e,i)=>{const u=U(e.name),c=isCardio(e.name);
    h+=`<div class="ex" data-i="${i}"><div class="ex-head"><div><h3>${esc(e.name)}</h3><small>${e.sets.filter(s=>s.done).length}/${e.sets.length} ${c?"tramos":"series"}</small></div><button class="ghost" data-a="delex" aria-label="Quitar ${esc(e.name)}">Quitar</button></div>`;
    e.sets.forEach((s,j)=>{
      h+=`<div class="set${s.done?" done":""}" data-j="${j}"><span class="n">${j+1}</span>
      <label class="field"><input data-f="kg" inputmode="decimal" placeholder="0" value="${esc(s.kg)}" aria-label="${c?"Minutos":"Peso"} ${c?"tramo":"serie"} ${j+1}"><span>${u[0]}</span></label>
      <label class="field"><input data-f="reps" inputmode="${c?"decimal":"numeric"}" placeholder="0" value="${esc(s.reps)}" aria-label="${c?"Kilómetros":"Repeticiones"} ${c?"tramo":"serie"} ${j+1}"><span>${u[1]}</span></label>
      <button class="chk" data-a="tog" aria-pressed="${s.done}" aria-label="${c?"Tramo":"Serie"} ${j+1} completado">✓</button>
      <button class="ghost" data-a="delset" aria-label="Quitar serie ${j+1}">✕</button></div>`;
    });
    h+=`<button class="addset" data-a="addset">+ Añadir ${c?"tramo":"serie"}</button><input class="cm" data-f="note" maxlength="300" placeholder="Comentario (sensaciones, ajuste de máquina...)" value="${esc(e.note||"")}" aria-label="Comentario de ${esc(e.name)}"></div>`;
  });
  h+=`<button class="primary" data-a="open">+ Añadir ejercicio</button>`;
  h+=`<button class="finish${S.finished[sel]?" on":""}" data-a="finish"${ex.length?"":" disabled"} aria-pressed="${!!S.finished[sel]}">${S.finished[sel]?"✓ Entrenamiento completado":"Marcar entrenamiento completado"}</button>`;
  $("#day").innerHTML=h;
}
function renderHist(){
  const ks=Object.keys(S.days).filter(k=>S.days[k].length).sort().reverse();
  let h="<h2>Historial</h2>";
  if(!ks.length)h+='<p class="empty">Aquí aparecerá lo que vayas entrenando cada día.</p>';
  ks.forEach(k=>{
    const [y,m,d]=k.split("-").map(Number), ex=S.days[k], all=ex.flatMap(e=>e.sets), dn=all.filter(s=>s.done).length;
    const t=new Date(y,m-1,d).toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    h+=`<details><summary><div>${S.finished[k]?"✓ ":""}${t}</div><span>${ex.length} ejerc. · ${dn}/${all.length} series</span></summary><div class="hx">`;
    ex.forEach(e=>{const u=U(e.name);h+=`<b>${esc(e.name)}</b><div>`+e.sets.map((s,j)=>`<i class="${s.done?"d":""}">${s.done?"✓ ":""}${esc(s.kg||"–")} ${u[0]}${u[0]==="min"?" · ":" × "}${esc(s.reps||"–")} ${u[1]}</i>`).join("")+"</div>"+(e.note?`<p class="hn">💬 ${esc(e.note)}</p>`:"")});
    h+=`<button class="open-day" data-k="${k}">Abrir este día</button></div></details>`;
  });
  $("#hist").innerHTML=h;
}
$("#hist").addEventListener("click",e=>{const b=e.target.closest(".open-day");if(b){sel=b.dataset.k;const p=sel.split("-");vy=+p[0];vm=+p[1]-1;render();window.scrollTo({top:0,behavior:"smooth"})}});
function render(){renderCal();renderDay();renderHist()}

$("#day").addEventListener("input",e=>{
  const f=e.target.dataset.f; if(!f)return;
  const i=e.target.closest(".ex").dataset.i;
  if(f==="note"){S.days[sel][i].note=e.target.value;save();return}
  const j=e.target.closest(".set").dataset.j;
  S.days[sel][i].sets[j][f]=e.target.value; save();
});
$("#day").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b)return;
  const a=b.dataset.a, ex=S.days[sel]||(S.days[sel]=[]);
  const exEl=b.closest(".ex"), i=exEl&&+exEl.dataset.i, setEl=b.closest(".set"), j=setEl&&+setEl.dataset.j;
  if(a==="open"){openSheet();return}
  if(a==="tog")ex[i].sets[j].done=!ex[i].sets[j].done;
  if(a==="delset")ex[i].sets.splice(j,1);
  if(a==="addset"){const l=ex[i].sets.at(-1)||{kg:"",reps:isCardio(ex[i].name)?"":"10"};ex[i].sets.push({kg:l.kg,reps:l.reps,done:false})}
  if(a==="delex"){if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="¿Seguro?";setTimeout(()=>{b.classList.remove("arm");b.textContent="Quitar"},3000);return}ex.splice(i,1)}
  if(a==="finish"){if(S.finished[sel])delete S.finished[sel];else S.finished[sel]=true}
  if(!ex.length){delete S.days[sel];delete S.finished[sel]}
  save();render();
});
$("#cal").addEventListener("click",e=>{const b=e.target.closest(".day");if(b){sel=b.dataset.k;render()}});
$("#prev").onclick=()=>{vm--;if(vm<0){vm=11;vy--}renderCal()};
$("#next").onclick=()=>{vm++;if(vm>11){vm=0;vy++}renderCal()};

function lastSets(name){
  const ks=Object.keys(S.days).filter(k=>k<sel).sort().reverse();
  for(const k of ks){const f=S.days[k].find(e=>e.name===name);if(f&&f.sets.length)return f.sets.map(s=>({kg:s.kg,reps:s.reps,done:false}))}
  return isCardio(name)?[{kg:"",reps:"",done:false}]:[1,2,3].map(()=>({kg:"",reps:"10",done:false}));
}
function addEx(name){
  const ex=S.days[sel]||(S.days[sel]=[]);
  if(ex.some(e=>e.name===name))return;
  ex.push({name,sets:lastSets(name)});
  save();render();renderList();
}
function groups(){const g={...LIB};if(S.custom.length)g["Mis ejercicios"]=S.custom;return g}
function renderList(){
  const g=groups(), names=["Todos",...Object.keys(g)];
  $("#chips").innerHTML=names.map(n=>`<button class="chip${n===filter?" on":""}" data-g="${esc(n)}">${esc(n)}</button>`).join("");
  const added=(S.days[sel]||[]).map(e=>e.name), ql=q.trim().toLowerCase();
  let items=[];
  Object.entries(g).forEach(([grp,arr])=>{if(filter==="Todos"||filter===grp)arr.forEach(n=>{if(!ql||n.toLowerCase().includes(ql))items.push([n,grp])})});
  let h=items.map(([n,grp])=>`<button class="item${added.includes(n)?" added":""}" data-n="${esc(n)}"><span>${esc(n)}<br><small>${esc(grp)}</small></span><span>${added.includes(n)?"✓ Añadido":"+"}</span></button>`).join("");
  const exact=Object.values(g).flat().some(n=>n.toLowerCase()===ql);
  if(ql&&!exact)h+=`<button class="item" data-new="1"><span>Crear «${esc(q.trim())}»<br><small>Ejercicio propio</small></span><span>+</span></button>`;
  $("#list").innerHTML=h||`<p class="empty">Sin resultados.</p>`;
}
function openSheet(){$("#sheet").classList.add("open");renderList();$("#q").focus()}
function closeSheet(){$("#sheet").classList.remove("open")}
$("#close").onclick=closeSheet;
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
$("#q").addEventListener("input",e=>{q=e.target.value;renderList()});
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){filter=b.dataset.g;renderList()}});
$("#list").addEventListener("click",e=>{
  const b=e.target.closest(".item");if(!b)return;
  if(b.dataset.new){const n=q.trim();if(!S.custom.includes(n))S.custom.push(n);q="";$("#q").value="";addEx(n)}
  else if(!b.classList.contains("added"))addEx(b.dataset.n);
});
const msg=t=>$("#bkmsg").textContent=t;
$("#exp").onclick=()=>{
  const t=JSON.stringify(S), ta=$("#bkt"); ta.value=t; ta.focus(); ta.select();
  const m="Datos listos. Mantén pulsado el texto, elige Copiar y pégalo en tus notas.";
  try{navigator.clipboard.writeText(t).then(()=>msg("Copiado. Pégalo en tus notas o envíatelo por mensaje para guardarlo."),()=>msg(m))}catch(e){msg(m)}
};
$("#imp").onclick=()=>{
  try{
    const o=JSON.parse($("#bkt").value.trim());
    if(!o||typeof o.days!=="object")throw 0;
    let n=0;
    Object.entries(o.days).forEach(([k,v])=>{if(/^\d{4}-\d\d-\d\d$/.test(k)&&Array.isArray(v)&&v.length){S.days[k]=v;n++}});
    Object.keys(o.finished||{}).forEach(k=>{if(S.days[k])S.finished[k]=true});
    (o.custom||[]).forEach(c=>{if(typeof c==="string"&&!S.custom.includes(c))S.custom.push(c)});
    save();render();msg("Importados "+n+" días.");
  }catch(e){msg("No he podido leer esos datos. Comprueba que has pegado el texto completo.")}
};
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}})}
function who(){const u=USR.users.find(x=>x.id===USR.cur);$("#whoName").textContent=u?u.name:""}
function enter(id){USR.cur=id;saveU();loadS();sel=todayKey;const n=new Date();vy=n.getFullYear();vm=n.getMonth();who();$("#usr").classList.remove("open");render()}
function renderUsers(){
  const first=!USR.users.length;
  $("#usrT").textContent=first?"Bienvenido":"Usuarios";
  $("#usrP").textContent=first?"Crea tu usuario para empezar. Tus entrenamientos se guardan en este dispositivo.":"Elige un usuario o crea uno nuevo. Cada uno tiene su propio calendario e historial.";
  $("#usrX").style.display=USR.cur?"":"none";
  $("#usrL").innerHTML=USR.users.map(u=>`<div class="item${u.id===USR.cur?" added":""}"><button class="ub" data-u="${esc(u.id)}">${esc(u.name)}${u.id===USR.cur?" · actual":""}</button><button class="ghost" data-del="${esc(u.id)}">Borrar</button></div>`).join("");
}
function openUsers(){renderUsers();$("#usr").classList.add("open")}
$("#chg").onclick=openUsers;
$("#usrX").onclick=()=>$("#usr").classList.remove("open");
$("#usrL").addEventListener("click",e=>{
  const d=e.target.closest("[data-del]");
  if(d){
    if(!d.classList.contains("arm")){d.classList.add("arm");d.textContent="¿Seguro? Se borran sus datos";setTimeout(()=>{d.classList.remove("arm");d.textContent="Borrar"},3000);return}
    const id=d.dataset.del;
    try{localStorage.removeItem(dk(id))}catch(_){}
    USR.users=USR.users.filter(u=>u.id!==id);
    if(USR.cur===id){USR.cur=null;saveU();if(USR.users.length){enter(USR.users[0].id)}else{S={days:{},finished:{},custom:[]};who();render();openUsers()}}
    else saveU();
    renderUsers();return;
  }
  const b=e.target.closest("[data-u]");if(b)enter(b.dataset.u);
});
$("#usrC").onclick=()=>{
  const n=$("#usrN").value.trim();if(!n){$("#usrN").focus();return}
  const id="u"+Date.now().toString(36);
  if(!USR.users.length){try{const old=localStorage.getItem(OLD);if(old&&!localStorage.getItem(dk(id)))localStorage.setItem(dk(id),old)}catch(_){}}
  USR.users.push({id,name:n.slice(0,30)});$("#usrN").value="";enter(id);
};
$("#usrN").addEventListener("keydown",e=>{if(e.key==="Enter")$("#usrC").click()});
if(USR.cur&&!USR.users.some(u=>u.id===USR.cur))USR.cur=null;
if(!USR.cur&&USR.users.length)USR.cur=USR.users[0].id;
if(USR.cur){loadS();who();render()}else{render();openUsers()}
</script>
</body>
</html>
